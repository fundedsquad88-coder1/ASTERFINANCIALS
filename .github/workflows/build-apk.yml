name: Build Aster APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'HTTPS URL of the deployed Aster API (optional for sandbox builds)'
        required: false
        type: string
  push:
    branches: [ main, aster-v1 ]

env:
  ASTER_API_BASE_URL: ${{ inputs.api_base_url || '' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1 || true)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle assembleDebug --stacktrace -PasterApiBaseUrl="$ASTER_API_BASE_URL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aster-financials-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
