name: Check Aster API

on:
  workflow_dispatch:
  push:
    branches: [ main, aster-native, aster-production-core ]

concurrency:
  group: aster-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server.js
