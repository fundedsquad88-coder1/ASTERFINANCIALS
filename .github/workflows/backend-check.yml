name: Check Aster API

on:

concurrency:
  group: aster-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  workflow_dispatch:
  push:
    branches: [ main, aster-native ]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server.js
