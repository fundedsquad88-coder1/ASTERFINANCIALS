name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [ main, aster-v1 ]
  pull_request:
    branches: [ main, aster-v1 ]

jobs:
  build-backend:
    name: TypeScript + Prisma build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://aster:aster_ci_password@localhost:5432/aster_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Confirm Prisma environment
        run: node -e "if (!process.env.DATABASE_URL) process.exit(1); console.log('DATABASE_URL is present for CI')"
      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: TypeScript build
        run: npm run build
