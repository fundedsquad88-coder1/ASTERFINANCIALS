name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [ main, aster-v1 ]
  pull_request:
    branches: [ main, aster-v1 ]

jobs:
  build-backend:
    name: TypeScript + Prisma build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aster
          POSTGRES_PASSWORD: aster_ci_password
          POSTGRES_DB: aster_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aster -d aster_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://aster:aster_ci_password@localhost:5432/aster_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Confirm Prisma environment
        run: node -e "if (!process.env.DATABASE_URL) process.exit(1); console.log('DATABASE_URL is present for CI')"
      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Apply migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - name: Verify migration state
        run: npx prisma migrate status --schema=prisma/schema.prisma
      - name: TypeScript build
        run: npm run build
      - name: Verify seed compiles
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck prisma/seed.ts
