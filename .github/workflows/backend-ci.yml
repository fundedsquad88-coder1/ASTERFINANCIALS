name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [ main, aster-v1 ]
  pull_request:
    branches: [ main, aster-v1 ]

env:
  # Prisma schema validation/generation only needs a syntactically valid URL.
  # CI does not connect to a production database.
  DATABASE_URL: postgresql://aster:aster_ci_password@localhost:5432/aster_ci?schema=public

jobs:
  build-backend:
    name: TypeScript + Prisma build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript build
        run: npm run build
