openapi: 3.0.3
info:
  title: Aster Financials API
  version: 0.1.0
  description: Production API contract for the V23 Auto-Invest platform.
servers:
  - url: https://api.example.invalid
    description: Placeholder only — replace after deployment.
paths:
  /health:
    get:
      summary: Service health
      responses:
        '200':
          description: Healthy
  /v1/auth/register:
    post:
      summary: Register a user
      responses:
        '201': {description: Account created}
        '400': {description: Invalid request}
  /v1/auth/login:
    post:
      summary: Start authenticated session
      responses:
        '200': {description: Session established}
        '401': {description: Authentication failed}
  /v1/me:
    get:
      security: [{session: []}]
      summary: Current account
      responses:
        '200': {description: Account}
  /v1/kyc/status:
    get:
      security: [{session: []}]
      summary: Current KYC verification state
      responses:
        '200': {description: KYC state}
  /v1/wallet/deposits:
    post:
      security: [{session: []}]
      summary: Create a deposit intent when a provider is configured
      responses:
        '201': {description: Deposit intent}
        '503': {description: Deposit provider not configured}
  /v1/wallet/withdrawals:
    post:
      security: [{session: []}]
      summary: Create a withdrawal request when a provider is configured
      responses:
        '201': {description: Withdrawal request}
        '503': {description: Withdrawal provider not configured}
  /v1/wallet:
    get:
      security: [{session: []}]
      summary: Ledger-derived wallet balances
      responses:
        '200': {description: Wallet snapshot}
  /v1/wallet/deposits:
    post:
      security: [{session: []}]
      summary: Create a deposit intent/address
      responses:
        '201': {description: Deposit intent}
  /v1/wallet/withdrawals:
    post:
      security: [{session: []}]
      summary: Create a withdrawal request
      responses:
        '201': {description: Withdrawal request}
        '409': {description: Risk/compliance hold}
  /v1/transactions:
    get:
      security: [{session: []}]
      summary: Ledger transaction history
      responses:
        '200': {description: Transactions}
  /v1/autoinvest/strategies:
    get:
      summary: Available strategies
      responses:
        '200': {description: Strategy catalogue}
  /v1/autoinvest:
    get:
      security: [{session: []}]
      summary: Active Auto-Invest strategies
      responses:
        '200': {description: Active strategies}
    post:
      security: [{session: []}]
      summary: Activate an Auto-Invest strategy
      responses:
        '201': {description: Strategy activated}
        '409': {description: Insufficient/locked balance or compliance hold}
  /v1/autoinvest/{id}/pause:
    post:
      security: [{session: []}]
      summary: Pause an active strategy
      responses:
        '200': {description: Strategy paused}
  /v1/referrals:
    get:
      security: [{session: []}]
      summary: Referral ledger summary
      responses:
        '200': {description: Referral data}
  /v1/notifications:
    get:
      security: [{session: []}]
      summary: Account notifications
      responses:
        '200': {description: Notifications}
  /v1/security/sessions:
    get:
      security: [{session: []}]
      summary: Active sessions
      responses:
        '200': {description: Sessions}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-AsterSession
