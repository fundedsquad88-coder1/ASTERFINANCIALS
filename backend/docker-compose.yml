services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: aster
      POSTGRES_USER: aster
      POSTGRES_PASSWORD: change-me-in-local-only
    volumes:
      - aster-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U aster -d aster"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://aster:change-me-in-local-only@db:5432/aster
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  aster-db:
