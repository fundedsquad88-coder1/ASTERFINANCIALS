<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aster Operations</title>
<style>body{font-family:Inter,system-ui;background:#f6f6f3;color:#111;margin:0}header{background:#111;color:#d7a83d;padding:18px 24px;font-weight:800;display:flex;justify-content:space-between}main{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}input,button{padding:10px;border-radius:9px;border:1px solid #ccc}button{cursor:pointer;background:#111;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}.muted{color:#666;font-size:13px}.danger{color:#a00}@media(max-width:800px){.row{grid-template-columns:1fr}}</style></head>
<body><header><span>ASTER OPERATIONS</span><span id="status">Secure console</span></header><main>
<div class="card"><div class="muted">API base URL</div><input id="api" style="width:100%;box-sizing:border-box" placeholder="https://api.example.com"><div class="muted">Admin access token</div><input id="token" type="password" style="width:100%;box-sizing:border-box" placeholder="Bearer token"><br><br><button onclick="load()">Load pending withdrawals</button></div>
<div id="list"></div></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function api(path,opt={}){const base=document.getElementById("api").value.replace(/\/$/,"");const token=document.getElementById("token").value;const r=await fetch(base+path,{...opt,headers:{"content-type":"application/json","authorization:"Bearer "+token,...(opt.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.message||j.error||"Request failed");return j}
async function load(){try{const j=await api("/api/admin/withdrawals?status=pending");document.getElementById("list").innerHTML=j.withdrawals.length?j.withdrawals.map(w=>`<div class="card"><div class="row"><div><b>${esc(w.fullName)}</b><div class="muted">${esc(w.email)}</div></div><div><b>${esc(w.amount)} USDT</b><div class="muted">${esc(w.network)}</div></div><div><b>Destination</b><div class="muted">${esc(w.destinationAddress)}</div></div><div><b>Requested</b><div class="muted">${esc(w.requestedAt)}</div></div></div><br><button onclick="approve('${w.id}')">Approve</button> <button onclick="rejectW('${w.id}')">Reject</button></div>`).join(""):"<div class='card'>No pending withdrawals.</div>"}catch(e){document.getElementById("list").innerHTML="<div class='card danger'>"+esc(e.message)+"</div>"}}
async function approve(id){if(!confirm("Approve this withdrawal?"))return;try{const j=await api("/api/admin/withdrawals/"+id+"/approve",{method:"POST"});alert("Approved. Net payout: "+j.withdrawal.netAmount+" USDT. If the treasury signer is configured, execute it from the processing queue.");load()}catch(e){alert(e.message)}}
async function rejectW(id){const note=prompt("Reason for rejection","Rejected by operations");if(note===null)return;try{await api("/api/admin/withdrawals/"+id+"/reject",{method:"POST",body:JSON.stringify({note})});load()}catch(e){alert(e.message)}}
</script></body></html>
