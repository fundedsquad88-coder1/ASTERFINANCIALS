<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aster Financials · Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050606;color:#f4f1e8;font:14px Arial,sans-serif}header{height:70px;border-bottom:1px solid #d5a83f44;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:#070808ee;backdrop-filter:blur(10px)}h1{font-size:18px;margin:0}.gold{color:#e8bd50}.wrap{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0a0b0b;border:1px solid #d5a83f44;border-radius:14px;padding:18px}.metric{font-size:26px;margin-top:8px}.muted{color:#888;font-size:11px}.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.tabs button,button{background:#0b0c0c;color:#ddd;border:1px solid #333;border-radius:9px;padding:10px 14px;cursor:pointer}.tabs .on,.goldbtn{border-color:#d5a83f;background:#d5a83f;color:#090909;font-weight:bold}.table{overflow:auto}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 130px;gap:12px;padding:13px 8px;border-bottom:1px solid #222;min-width:780px}.row.head{color:#888;font-size:10px}.login{max-width:420px;margin:15vh auto}.input{width:100%;padding:13px;margin:7px 0 12px;border-radius:9px;border:1px solid #333;background:#080909;color:#fff}.error{color:#f26a6a;min-height:18px;font-size:11px}.hidden{display:none}.notice{padding:10px;border:1px solid #8c6b25;border-radius:8px;color:#c9a044;font-size:11px;margin-bottom:15px}</style></head><body><div id="login" class="wrap"><div class="card login"><h1>Aster <span class="gold">Financials</span></h1><p class="muted">Administrator console</p><input id="api" class="input" placeholder="Backend URL e.g. https://api.example.com"><input id="email" class="input" type="email" placeholder="Admin email"><input id="password" class="input" type="password" placeholder="Admin password"><div id="err" class="error"></div><button class="goldbtn" onclick="login()">Sign in</button></div></div><div id="app" class="hidden"><header><h1>ASTER <span class="gold">ADMIN</span></h1><button onclick="logout()">Sign out</button></header><main class="wrap"><div class="notice">SANDBOX ADMIN • Financial actions are review/queue operations only. No blockchain transaction or real-money trade settlement is performed by this console.</div><div class="grid"><div class="card"><div class="muted">Users</div><div id="users" class="metric">—</div></div><div class="card"><div class="muted">Pending deposits</div><div id="deposits" class="metric">—</div></div><div class="card"><div class="muted">Pending withdrawals</div><div id="withdrawals" class="metric">—</div></div><div class="card"><div class="muted">Open stakes</div><div id="stakes" class="metric">—</div></div></div><div class="tabs"><button class="on" onclick="load('overview',this)">Overview</button><button onclick="load('users',this)">Users</button><button onclick="load('deposits',this)">Deposits</button><button onclick="load('withdrawals',this)">Withdrawals</button><button onclick="load('stakes',this)">Staking</button><button onclick="load('ledger',this)">Ledger</button></div><section id="content" class="card"></section></main></div><script>let token=localStorage.getItem('aster_admin_token')||'';let API=localStorage.getItem('aster_api_base')||'';const $=x=>document.getElementById(x);$('api').value=API;async function req(path,opt={}){if(!API)throw Error('Enter the backend URL first');const r=await fetch(API.replace(/\/$/,'')+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){API=$('api').value.trim();localStorage.setItem('aster_api_base',API);try{const d=await req('/api/v1/admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.token;localStorage.setItem('aster_admin_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');loadOverview()}catch(e){$('err').textContent=e.message}}async function loadOverview(){try{const d=await req('/api/v1/admin/overview');$('users').textContent=d.users;$('deposits').textContent=d.pendingDeposits;$('withdrawals').textContent=d.pendingWithdrawals;$('stakes').textContent=d.activeStakes;$('content').innerHTML='<h2>Platform overview</h2><p class="muted">'+new Date().toLocaleString()+'</p><p>Use the sections above to review users, deposits, withdrawals, staking positions and the ledger.</p>'}catch(e){$('content').innerHTML='<div class="error">'+e.message+'</div>'}}async function load(type,btn){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');try{if(type==='overview')return loadOverview();const d=await req('/api/v1/admin/'+type);render(type,d)}catch(e){$('content').innerHTML='<div class="error">'+e.message+'</div>'}}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function render(type,d){let rows=[];if(type==='users')rows=d.users.map(x=>[x.email,x.id,x.createdAt,'ACTIVE','']);if(type==='deposits')rows=d.deposits.map(x=>[x.user.email,x.amount+' '+x.asset,x.createdAt,x.status,'']);if(type==='withdrawals')rows=d.withdrawals.map(x=>[x.user.email,x.amount+' '+x.asset,x.createdAt,x.status,x.status==='PENDING'?'<button onclick="approve(\''+esc(x.id)+'\')">Approve queue</button>':'']);if(type==='stakes')rows=d.stakes.map(x=>[x.user.email,x.amount+' '+x.asset,x.startedAt,new Date(x.endsAt).toLocaleDateString(),'']);if(type==='ledger')rows=d.ledger.map(x=>[x.account,x.amount+' '+x.assetSymbol,x.createdAt,x.direction,x.reference]);$('content').innerHTML='<h2>'+esc(type[0].toUpperCase()+type.slice(1))+'</h2><div class="table"><div class="row head"><span>Account</span><span>Amount</span><span>Date</span><span>Status</span><span>Action</span></div>'+rows.map(r=>'<div class="row">'+r.map((c,i)=>'<span>'+((i===4&&type==='withdrawals'&&String(c).startsWith('<button'))?c:esc(c))+'</span>').join('')+'</div>').join('')+'</div>'}async function approve(id){if(!confirm('Mark this withdrawal APPROVED for downstream/manual processing?'))return;try{await req('/api/v1/admin/withdrawals/'+encodeURIComponent(id)+'/approve',{method:'POST'});await load('withdrawals',document.querySelectorAll('.tabs button')[3]);loadOverview()}catch(e){alert(e.message)}}function logout(){token='';localStorage.removeItem('aster_admin_token');location.reload()}if(token&&API){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadOverview()}</script></body></html>
