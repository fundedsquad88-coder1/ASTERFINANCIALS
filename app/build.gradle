plugins {
    id 'com.android.application'
}

android {
    namespace 'com.asterfinancials.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.asterfinancials.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        def apiBaseUrl = project.findProperty('asterApiBaseUrl') ?: ''
        buildConfigField 'String', 'ASTER_API_BASE_URL', '"' + apiBaseUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }
}
