plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' version '2.0.21'; id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' }
android {
    namespace 'com.asterfinancials.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.asterfinancials.app'
        minSdk 24
        targetSdk 35
        versionCode 102
        versionName '6.1-auth'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures { compose true }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.webkit:webkit:1.13.0'
}